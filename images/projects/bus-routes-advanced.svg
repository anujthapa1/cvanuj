<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-map" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="route-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="route-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="680" fill="url(#bg-map)" />

  <!-- Styled Map Roads Network (Pokhara Topology) -->
  <g stroke="#1e293b" stroke-width="6" fill="none" opacity="0.6">
    <path d="M-50 180 Q 300 220, 600 160 T 1250 200" />
    <path d="M-50 420 Q 350 380, 700 460 T 1250 390" />
    <path d="M220 -50 Q 280 300, 240 730" />
    <path d="M680 -50 Q 620 320, 720 730" />
    <path d="M960 -50 Q 1020 300, 940 730" />
  </g>
  <g stroke="#334155" stroke-width="2" fill="none" opacity="0.4">
    <!-- Minor streets & alleys grid -->
    <line x1="100" y1="100" x2="350" y2="350" />
    <line x1="350" y1="350" x2="600" y2="250" />
    <line x1="600" y1="250" x2="900" y2="400" />
    <line x1="500" y1="500" x2="800" y2="600" />
    <line x1="200" y1="550" x2="500" y2="400" />
    <line x1="750" y1="120" x2="1100" y2="280" />
  </g>

  <!-- Fewa Lake Graphic Indicator (Pokhara feature) -->
  <path d="M80 260 C 60 360, 100 480, 180 540 C 140 460, 120 380, 140 300 Z" fill="#0369a1" opacity="0.25" />
  <text x="110" y="380" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" opacity="0.6" transform="rotate(-70 110 380)">FEWA LAKE</text>

  <!-- Active Bus Route Polyline (Google Directions Render) -->
  <path d="M190 320 L 320 280 L 460 330 L 620 260 L 780 290 L 920 210 L 1050 240" 
        fill="none" stroke="url(#route-grad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#route-glow)" />

  <!-- Route Pulse Dashed Line -->
  <path d="M190 320 L 320 280 L 460 330 L 620 260 L 780 290 L 920 210 L 1050 240" 
        fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="8 8" stroke-linecap="round" />

  <!-- Bus Stop / Waypoint Markers -->
  <!-- Stop 1: Hallanchowk (Lakeside) -->
  <g transform="translate(190, 320)">
    <circle cx="0" cy="0" r="14" fill="#0284c7" opacity="0.3" />
    <circle cx="0" cy="0" r="7" fill="#38bdf8" />
    <rect x="-60" y="-45" width="120" height="24" rx="4" fill="#090d16" stroke="#38bdf8" stroke-width="1" />
    <text x="0" y="-29" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle" font-weight="bold">📍 Lakeside (Origin)</text>
  </g>

  <!-- Stop 2: Zero KM -->
  <g transform="translate(460, 330)">
    <circle cx="0" cy="0" r="6" fill="#818cf8" />
    <rect x="-40" y="-38" width="80" height="22" rx="4" fill="#090d16" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    <text x="0" y="-24" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Zero KM</text>
  </g>

  <!-- Stop 3: Prithvi Chowk (Major Hub) -->
  <g transform="translate(620, 260)">
    <circle cx="0" cy="0" r="18" fill="#6366f1" opacity="0.3" />
    <circle cx="0" cy="0" r="8" fill="#a855f7" />
    <rect x="-60" y="-48" width="120" height="24" rx="4" fill="#090d16" stroke="#a855f7" stroke-width="1" />
    <text x="0" y="-32" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle" font-weight="bold">🚌 Prithvi Chowk Hub</text>
  </g>

  <!-- Stop 4: Mahendrapool -->
  <g transform="translate(780, 290)">
    <circle cx="0" cy="0" r="6" fill="#818cf8" />
    <rect x="-50" y="-38" width="100" height="22" rx="4" fill="#090d16" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    <text x="0" y="-24" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Mahendrapool</text>
  </g>

  <!-- Stop 5: Baglung Bus Park (Destination) -->
  <g transform="translate(1050, 240)">
    <circle cx="0" cy="0" r="14" fill="#22c55e" opacity="0.3" />
    <circle cx="0" cy="0" r="7" fill="#22c55e" />
    <rect x="-70" y="-45" width="140" height="24" rx="4" fill="#090d16" stroke="#22c55e" stroke-width="1" />
    <text x="0" y="-29" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle" font-weight="bold">🏁 Baglung Bus Park</text>
  </g>

  <!-- Google Maps Style Search & Autocomplete Header (Top) -->
  <g transform="translate(40, 40)">
    <rect width="440" height="60" rx="10" fill="#0f172a" stroke="rgba(56,189,248,0.4)" stroke-width="1" />
    <circle cx="35" cy="30" r="12" fill="#38bdf8" />
    <text x="35" y="34" fill="#0f172a" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="bold">🔍</text>
    <text x="65" y="27" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold">POKHARA BUS ROUTE FINDER</text>
    <text x="65" y="47" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">Google Places Autocomplete API</text>
  </g>

  <!-- Navigation Summary Card (Bottom Left) -->
  <g transform="translate(40, 470)">
    <rect width="420" height="170" rx="10" fill="#0f172a" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
    <text x="20" y="32" fill="#38bdf8" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold">SELECTED ROUTE SUMMARY</text>
    
    <g transform="translate(20, 50)">
      <text x="0" y="16" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">Route: Lakeside → Prithvi Chowk → Baglung Buspark</text>
      <text x="0" y="42" fill="#e2e8f0" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="bold">8.6 km • ~24 mins</text>
      <text x="0" y="70" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold">Est. DoTM Scientific Fare: Rs. 28</text>
      <text x="0" y="94" fill="#a855f7" font-family="'JetBrains Mono', monospace" font-size="11">Student Discount (45%): Rs. 15</text>
    </g>
  </g>

  <!-- Tech Stack Floating Card (Top Right) -->
  <g transform="translate(820, 40)">
    <rect width="340" height="105" rx="10" fill="#0f172a" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <text x="20" y="28" fill="#e2e8f0" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="bold">FULL-STACK MONOREPO ARCHITECTURE</text>
    
    <g transform="translate(20, 45)">
      <rect width="80" height="22" rx="4" fill="#1e293b" />
      <text x="40" y="15" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">TypeScript</text>

      <rect x="88" width="70" height="22" rx="4" fill="#1e293b" />
      <text x="123" y="15" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">React 19</text>

      <rect x="166" width="60" height="22" rx="4" fill="#1e293b" />
      <text x="196" y="15" fill="#a855f7" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Vite</text>

      <rect x="234" width="75" height="22" rx="4" fill="#1e293b" />
      <text x="271.5" y="15" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Drizzle</text>
    </g>
    <text x="20" y="92" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">Shared types • Client / Server split • Google Maps SDK</text>
  </g>
</svg>
