<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-vc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="680" fill="url(#bg-vc)" />

  <!-- Perspective 3D Grid -->
  <g opacity="0.25" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="460" x2="1200" y2="460" />
    <line x1="0" y1="510" x2="1200" y2="510" />
    <line x1="0" y1="570" x2="1200" y2="570" />
    <line x1="0" y1="640" x2="1200" y2="640" />
    <line x1="600" y1="360" x2="-200" y2="680" />
    <line x1="600" y1="360" x2="100" y2="680" />
    <line x1="600" y1="360" x2="350" y2="680" />
    <line x1="600" y1="360" x2="600" y2="680" />
    <line x1="600" y1="360" x2="850" y2="680" />
    <line x1="600" y1="360" x2="1100" y2="680" />
    <line x1="600" y1="360" x2="1400" y2="680" />
  </g>

  <!-- Starfield / ambient particles -->
  <g fill="#38bdf8" opacity="0.6">
    <circle cx="120" cy="80" r="1.5" />
    <circle cx="280" cy="140" r="2" />
    <circle cx="450" cy="60" r="1" />
    <circle cx="780" cy="90" r="2" />
    <circle cx="920" cy="130" r="1.5" />
    <circle cx="1060" cy="70" r="2" />
    <circle cx="1140" cy="180" r="1.5" />
  </g>

  <!-- Low Poly 3D Campus Buildings Isometric Layout -->
  <!-- Building 1: CS & Tech Lab (Left) -->
  <g transform="translate(180, 240)">
    <polygon points="120,40 220,90 120,140 20,90" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <polygon points="20,90 120,140 120,240 20,190" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" opacity="0.9" />
    <polygon points="120,140 220,90 220,190 120,240" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity="0.8" />
    <line x1="40" y1="130" x2="100" y2="160" stroke="#06b6d4" stroke-width="3" opacity="0.8" />
    <line x1="40" y1="160" x2="100" y2="190" stroke="#06b6d4" stroke-width="3" opacity="0.8" />
    <line x1="140" y1="160" x2="200" y2="130" stroke="#06b6d4" stroke-width="3" opacity="0.8" />
    <rect x="50" y="20" width="140" height="26" rx="6" fill="#090d16" stroke="#38bdf8" stroke-width="1" />
    <text x="120" y="38" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle" font-weight="bold">CS &amp; IT LAB</text>
  </g>

  <!-- Building 2: Central Academic Hall (Center, Tall) -->
  <g transform="translate(480, 140)">
    <polygon points="120,20 230,75 120,130 10,75" fill="#334155" stroke="#60a5fa" stroke-width="2" />
    <polygon points="10,75 120,130 120,330 10,275" fill="#1e293b" stroke="#60a5fa" stroke-width="2" />
    <polygon points="120,130 230,75 230,275 120,330" fill="#0f172a" stroke="#60a5fa" stroke-width="2" />
    <line x1="30" y1="135" x2="100" y2="170" stroke="#38bdf8" stroke-width="3" opacity="0.9" />
    <line x1="30" y1="180" x2="100" y2="215" stroke="#38bdf8" stroke-width="3" opacity="0.9" />
    <line x1="30" y1="225" x2="100" y2="260" stroke="#38bdf8" stroke-width="3" opacity="0.9" />
    <line x1="140" y1="170" x2="210" y2="135" stroke="#818cf8" stroke-width="3" opacity="0.9" />
    <line x1="140" y1="215" x2="210" y2="180" stroke="#818cf8" stroke-width="3" opacity="0.9" />
    <line x1="120" y1="20" x2="120" y2="-30" stroke="#38bdf8" stroke-width="3" />
    <circle cx="120" cy="-30" r="6" fill="#38bdf8" filter="url(#glow)" />
    <rect x="40" y="-70" width="160" height="28" rx="6" fill="#090d16" stroke="#60a5fa" stroke-width="1.5" />
    <text x="120" y="-52" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle" font-weight="bold">MAIN ACADEMIC HALL</text>
  </g>

  <!-- Building 3: Central Library (Right) -->
  <g transform="translate(800, 230)">
    <polygon points="110,40 210,90 110,140 10,90" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" />
    <polygon points="10,90 110,140 110,240 10,190" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" />
    <polygon points="110,140 210,90 210,190 110,240" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" opacity="0.8" />
    <line x1="30" y1="135" x2="90" y2="165" stroke="#c084fc" stroke-width="3" opacity="0.8" />
    <line x1="30" y1="170" x2="90" y2="200" stroke="#c084fc" stroke-width="3" opacity="0.8" />
    <rect x="35" y="15" width="150" height="26" rx="6" fill="#090d16" stroke="#a855f7" stroke-width="1" />
    <text x="110" y="33" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle" font-weight="bold">CENTRAL LIBRARY</text>
  </g>

  <!-- Player Avatar Indicator (Interactive Exploration) -->
  <g transform="translate(420, 470)">
    <ellipse cx="0" cy="0" rx="30" ry="15" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.8" />
    <ellipse cx="0" cy="0" rx="16" ry="8" fill="#22c55e" opacity="0.3" />
    <path d="M0 -45 C-12 -45 -18 -32 0 0 C18 -32 12 -45 0 -45 Z" fill="#22c55e" />
    <circle cx="0" cy="-32" r="5" fill="#052e16" />
    <rect x="-60" y="-76" width="120" height="24" rx="5" fill="#090d16" stroke="#22c55e" stroke-width="1" />
    <text x="0" y="-60" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle" font-weight="bold">You (Student_01)</text>
  </g>

  <!-- Another Player Avatar (Multiplayer Sync) -->
  <g transform="translate(730, 440)">
    <ellipse cx="0" cy="0" rx="24" ry="12" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" />
    <path d="M0 -35 C-10 -35 -14 -24 0 0 C14 -24 10 -35 0 -35 Z" fill="#38bdf8" />
    <rect x="-55" y="-62" width="110" height="22" rx="4" fill="#090d16" stroke="#38bdf8" stroke-width="1" />
    <text x="0" y="-47" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Aarav (CS Dept)</text>
  </g>

  <!-- HUD Overlay - Top Header -->
  <g transform="translate(40, 40)">
    <rect width="320" height="64" rx="10" fill="#090d16" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    <text x="20" y="30" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="bold">VIRTUAL CAMPUS 3D</text>
    <text x="20" y="50" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">Three.js • React 19 • Socket.io Engine</text>
  </g>

  <!-- HUD Status - Top Right -->
  <g transform="translate(860, 40)">
    <rect width="300" height="64" rx="10" fill="#090d16" stroke="rgba(56,189,248,0.3)" stroke-width="1" />
    <circle cx="25" cy="32" r="5" fill="#22c55e" filter="url(#glow)" />
    <text x="40" y="28" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">LIVE MULTIPLAYER</text>
    <text x="40" y="48" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">12 Students Online • 60 FPS</text>
  </g>

  <!-- HUD Radar Minimap - Bottom Right -->
  <g transform="translate(1000, 480)">
    <circle cx="80" cy="80" r="75" fill="#090d16" stroke="#38bdf8" stroke-width="2" opacity="0.9" />
    <circle cx="80" cy="80" r="50" fill="none" stroke="#1e293b" stroke-width="1" />
    <circle cx="80" cy="80" r="25" fill="none" stroke="#1e293b" stroke-width="1" />
    <line x1="80" y1="5" x2="80" y2="155" stroke="#1e293b" stroke-width="1" />
    <line x1="5" y1="80" x2="155" y2="80" stroke="#1e293b" stroke-width="1" />
    <path d="M80 80 L145 40 A75 75 0 0 0 80 5 Z" fill="url(#cyan-glow)" opacity="0.25" />
    <circle cx="80" cy="80" r="4" fill="#22c55e" />
    <circle cx="110" cy="65" r="3" fill="#38bdf8" />
    <circle cx="55" cy="95" r="3" fill="#ec4899" />
    <text x="80" y="172" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">RADAR MINIMAP</text>
  </g>

  <!-- HUD Quick Controls - Bottom Left -->
  <g transform="translate(40, 580)">
    <rect width="360" height="56" rx="8" fill="#090d16" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
    <text x="18" y="24" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">CONTROLS: [WASD] Move • [SPACE] Jump</text>
    <text x="18" y="44" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">[M] Campus Map • [T] Fast Travel • [C] Chat</text>
  </g>
</svg>
