<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-buss" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a121e" />
      <stop offset="50%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#070b12" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="680" fill="url(#bg-buss)" />

  <g transform="translate(100, 80)">
    <rect width="1000" height="520" rx="12" fill="#0f172a" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    
    <!-- Titlebar -->
    <path d="M0 12 Q0 0 12 0 L988 0 Q1000 0 1000 12 L1000 46 L0 46 Z" fill="#1e293b" />
    <circle cx="24" cy="23" r="6" fill="#ef4444" />
    <circle cx="44" cy="23" r="6" fill="#f59e0b" />
    <circle cx="64" cy="23" r="6" fill="#10b981" />
    <text x="500" y="28" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="13" text-anchor="middle">
      ⚡ BUSS — Early React + Vite Route Visualization Prototype
    </text>

    <!-- Code & Architecture Diagram -->
    <g transform="translate(50, 80)">
      <rect width="420" height="380" rx="8" fill="#020617" stroke="#1e293b" stroke-width="1" />
      <text x="20" y="32" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold">// App.jsx (React + Vite Prototype)</text>
      
      <g transform="translate(20, 55)" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">
        <text y="20"><tspan fill="#ec4899">import</tspan> React, { useState } <tspan fill="#ec4899">from</tspan> <tspan fill="#a7f3d0">'react'</tspan>;</text>
        <text y="44"><tspan fill="#ec4899">import</tspan> { MapContainer } <tspan fill="#ec4899">from</tspan> <tspan fill="#a7f3d0">'./components/Map'</tspan>;</text>
        <text y="80"><tspan fill="#60a5fa">function</tspan> <tspan fill="#facc15">BusApp</tspan>() {</text>
        <text y="104">  <tspan fill="#ec4899">const</tspan> [route, setRoute] = <tspan fill="#60a5fa">useState</tspan>(<tspan fill="#a7f3d0">'all'</tspan>);</text>
        <text y="140">  <tspan fill="#ec4899">return</tspan> (</text>
        <text y="164">    &lt;<tspan fill="#38bdf8">div</tspan> <tspan fill="#c084fc">className</tspan>=<tspan fill="#a7f3d0">"min-h-screen bg-slate-900"</tspan>&gt;</text>
        <text y="188">      &lt;<tspan fill="#38bdf8">RouteSelector</tspan> <tspan fill="#c084fc">onSelect</tspan>={setRoute} /&gt;</text>
        <text y="212">      &lt;<tspan fill="#38bdf8">MapContainer</tspan> <tspan fill="#c084fc">activeRoute</tspan>={route} /&gt;</text>
        <text y="236">    &lt;/<tspan fill="#38bdf8">div</tspan>&gt;</text>
        <text y="260">  );</text>
        <text y="284">}</text>
      </g>
    </g>

    <!-- Prototype Preview Graphic -->
    <g transform="translate(510, 80)">
      <rect width="440" height="380" rx="8" fill="#1e293b" />
      <text x="25" y="35" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="bold">PROTOTYPE DISCOVERY MILESTONE</text>
      <text x="25" y="58" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">Initial experimentation before building bus_routes &amp; bus_routes_advanced</text>

      <g transform="translate(25, 90)">
        <rect width="390" height="70" rx="6" fill="#0f172a" />
        <text x="20" y="28" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">✓ Fast Vite Tooling Benchmarking</text>
        <text x="20" y="50" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">Tested HMR latency and component rendering</text>
      </g>

      <g transform="translate(25, 180)">
        <rect width="390" height="70" rx="6" fill="#0f172a" />
        <text x="20" y="28" fill="#a855f7" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">✓ Tailwind Utility Layout Prototyping</text>
        <text x="20" y="50" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">Responsive grid behavior and mobile breakpoints</text>
      </g>

      <g transform="translate(25, 270)">
        <rect width="390" height="70" rx="6" fill="#0f172a" />
        <text x="20" y="28" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">✓ Evolution Path</text>
        <text x="20" y="50" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">Laid groundwork for Next.js and Google Maps integration</text>
      </g>
    </g>
  </g>
</svg>
