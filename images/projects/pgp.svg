<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-pgp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d" />
      <stop offset="50%" stop-color="#111c30" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>
    <linearGradient id="pwa-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="680" fill="url(#bg-pgp)" />

  <!-- Top Navigation Header -->
  <g transform="translate(50, 40)">
    <rect width="1100" height="70" rx="10" fill="#0f172a" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <text x="30" y="32" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="bold">📦 PABITRA GANESH SUPPLIERS (PGP)</text>
    <text x="30" y="52" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">Operations &amp; Dispatcher Logistics Platform • Progressive Web App (PWA)</text>

    <!-- Role Portals Badges -->
    <g transform="translate(730, 18)">
      <rect width="160" height="34" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <text x="80" y="22" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">5 Dispatchers</text>

      <rect x="175" width="170" height="34" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1" />
      <text x="260" y="22" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">15 Active Drivers</text>
    </g>
  </g>

  <!-- Left: Live Tracking & Auto-Dispatch Hub -->
  <g transform="translate(50, 130)">
    <rect width="580" height="490" rx="10" fill="#0f172a" stroke="rgba(56,189,248,0.2)" stroke-width="1" />
    <text x="25" y="35" fill="#38bdf8" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="bold">REAL-TIME DISPATCH &amp; SIMULATED GPS</text>
    <text x="25" y="55" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">Auto-dispatch algorithm assigns orders to least-busy driver</text>

    <!-- GPS Map Box -->
    <g transform="translate(25, 75)">
      <rect width="530" height="230" rx="8" fill="#020617" stroke="#1e293b" stroke-width="1" />
      <!-- Grid roads -->
      <path d="M0 60 Q 200 80, 530 50" stroke="#1e293b" stroke-width="4" fill="none" />
      <path d="M0 160 Q 260 140, 530 180" stroke="#1e293b" stroke-width="4" fill="none" />
      <path d="M150 0 L 170 230" stroke="#1e293b" stroke-width="4" fill="none" />
      <path d="M380 0 L 360 230" stroke="#1e293b" stroke-width="4" fill="none" />
      
      <!-- Live route line -->
      <path d="M150 60 L 260 110 L 360 80 L 420 170" stroke="#10b981" stroke-width="5" fill="none" stroke-dasharray="6 4" />
      
      <!-- Driver Marker (DRV-104) -->
      <g transform="translate(360, 80)">
        <circle cx="0" cy="0" r="14" fill="#10b981" opacity="0.3" />
        <circle cx="0" cy="0" r="7" fill="#10b981" />
        <rect x="-45" y="-35" width="90" height="20" rx="4" fill="#090d16" stroke="#10b981" stroke-width="1" />
        <text x="0" y="-21" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle" font-weight="bold">DRV-104 (Active)</text>
      </g>

      <!-- Customer Destination Marker -->
      <g transform="translate(420, 170)">
        <circle cx="0" cy="0" r="6" fill="#ef4444" />
        <rect x="-45" y="10" width="90" height="20" rx="4" fill="#090d16" stroke="#ef4444" stroke-width="1" />
        <text x="0" y="24" fill="#fca5a5" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">Order #PGP-91</text>
      </g>
    </g>

    <!-- Dispatch-Driver Integrated Chat Mockup -->
    <g transform="translate(25, 320)">
      <rect width="530" height="145" rx="8" fill="#1e293b" />
      <text x="20" y="24" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="bold">💬 DISPATCHER ↔ DRIVER BUILT-IN CHAT</text>
      
      <!-- Chat message 1 -->
      <rect x="20" y="40" width="340" height="36" rx="6" fill="#0f172a" />
      <text x="32" y="63" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="11">Disp-102: Customer requested side entrance.</text>
      
      <!-- Chat message 2 (Driver reply) -->
      <rect x="170" y="85" width="340" height="36" rx="6" fill="#042f2e" stroke="#10b981" stroke-width="1" />
      <text x="182" y="108" fill="#a7f3d0" font-family="'JetBrains Mono', monospace" font-size="11">DRV-104: Understood. Arriving in 4 mins.</text>
    </g>
  </g>

  <!-- Right: Proof of Delivery (POD) & Notification Webhooks -->
  <g transform="translate(650, 130)">
    <rect width="500" height="490" rx="10" fill="#0f172a" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <text x="25" y="35" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="bold">PROOF OF DELIVERY &amp; WORKFLOW</text>
    <text x="25" y="55" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">Digital verification, customer signature, and multi-channel alerts</text>

    <!-- Proof of Delivery UI (Photo + Signature Pad) -->
    <g transform="translate(25, 75)">
      <!-- Photo capture box -->
      <rect width="215" height="160" rx="8" fill="#1e293b" />
      <text x="15" y="26" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">📸 DELIVERY PHOTO</text>
      <rect x="15" y="38" width="185" height="105" rx="4" fill="#0f172a" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
      <text x="107" y="96" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">[ Package at Doorstep ]</text>

      <!-- Signature capture pad -->
      <g transform="translate(235, 0)">
        <rect width="215" height="160" rx="8" fill="#1e293b" />
        <text x="15" y="26" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">✍️ CUSTOMER SIGNATURE</text>
        <rect x="15" y="38" width="185" height="105" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1" />
        <!-- Drawn cursive signature path -->
        <path d="M30 110 Q 55 60, 80 90 T 130 70 T 180 100" stroke="#38bdf8" stroke-width="2.5" fill="none" stroke-linecap="round" />
        <text x="107" y="130" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">✓ Signed &amp; Timestamped</text>
      </g>
    </g>

    <!-- Multi-Channel Webhook Notifications -->
    <g transform="translate(25, 260)">
      <rect width="450" height="205" rx="8" fill="#1e293b" />
      <text x="20" y="28" fill="#e2e8f0" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="bold">AUTOMATED WEBHOOK GATEWAYS</text>
      
      <!-- Notification row 1: Resend Email -->
      <g transform="translate(20, 42)">
        <rect width="410" height="38" rx="6" fill="#0f172a" />
        <text x="15" y="24" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">✉️ Resend API:</text>
        <text x="125" y="24" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">Customer receipt &amp; invoice dispatched</text>
      </g>

      <!-- Notification row 2: Twilio SMS / WhatsApp -->
      <g transform="translate(20, 88)">
        <rect width="410" height="38" rx="6" fill="#0f172a" />
        <text x="15" y="24" fill="#22c55e" font-family="'JetBrains Mono', monospace" font-size="11">📱 Twilio SMS/WA:</text>
        <text x="145" y="24" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">"Order delivered by driver DRV-104"</text>
      </g>

      <!-- Notification row 3: Slack Webhook -->
      <g transform="translate(20, 134)">
        <rect width="410" height="38" rx="6" fill="#0f172a" />
        <text x="15" y="24" fill="#eab308" font-family="'JetBrains Mono', monospace" font-size="11">⚡ Slack Webhook:</text>
        <text x="145" y="24" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">Ops channel update &amp; payout logged</text>
      </g>
    </g>
  </g>
</svg>
